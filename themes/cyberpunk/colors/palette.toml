[theme]
name = "Cyberpunk"
id = "cyberpunk"
version = "1.0.0"
description = "High contrast neon interface"

[colors]
background = "#0C0812"
surface = "#1E0F23"
surface_alt = "#30152F"

primary = "#FF235A"
secondary = "#00E6FF"

text = "#FFF0FA"
text_muted = "#B48CB4"

border = "#592B50"
success = "#39FF88"
warning = "#FFE14A"
error = "#FF235A"

[colors.states]
active = "#FF235A"
hover = "#00E6FF"
selected = "#451B48"

# Typography and geometry used by every generated configuration.
[typography]
font_family = "Inter"
mono_family = "JetBrainsMono Nerd Font"
font_size = 11

[metrics]
radius = 8
spacing = 8
border_width = 2
opacity = 100
shadow_range = 16
shadow_opacity = 55

# Waybar is dense, so it uses a smaller font and tighter corners than the rest
# of the desktop. Other integrations keep the shared tokens above.
[overrides.waybar]
font_size = 10
radius = 4
